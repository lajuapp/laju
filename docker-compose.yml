name: laju

services:
  api:
    container_name: laju-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: sh -c "npx prisma db push --skip-generate && node dist/main.js"
    env_file:
      - .env
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal, edge]

  worker:
    container_name: laju-worker
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["node", "dist/worker/main.js"]
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep 'worker/main.js' | grep -v grep || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [internal]

  backoffice:
    container_name: laju-backoffice
    build: ./apps/backoffice
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    networks: [internal, edge]

  postgres:
    container_name: laju-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    container_name: laju-redis
    image: redis:8-alpine
    restart: unless-stopped
    command: >
      sh -c "
        if [ -n \"$$REDIS_PASSWORD\" ]; then
          exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes
        else
          exec redis-server --appendonly yes
        fi
      "
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: >
        sh -c "
          if [ -n \"$$REDIS_PASSWORD\" ]; then
            redis-cli -a \"$$REDIS_PASSWORD\" ping
          else
            redis-cli ping
          fi
        "
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [internal]

  gotify:
    container_name: laju-gotify
    image: gotify/server:latest
    restart: unless-stopped
    environment:
      GOTIFY_DEFAULTUSER_NAME: ${GOTIFY_DEFAULTUSER_NAME:-lajuadmin}
      GOTIFY_DEFAULTUSER_PASS: ${GOTIFY_DEFAULTUSER_PASS:-laju_gotify_secure_pass_123}
    volumes:
      - gotify_data:/app/data
    networks: [internal]

  seaweedfs-master:
    container_name: laju-seaweedfs-master
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: ["master", "-mdir=/data/mdata"]
    volumes:
      - seaweedfs_mdata:/data/mdata
    networks: [internal]

  seaweedfs-volume:
    container_name: laju-seaweedfs-volume
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: ["volume", "-mserver=seaweedfs-master:9333", "-dir=/data/vdata"]
    volumes:
      - seaweedfs_vdata:/data/vdata
    depends_on: [seaweedfs-master]
    networks: [internal]

  seaweedfs-filer:
    container_name: laju-seaweedfs-filer
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: ["filer", "-master=seaweedfs-master:9333"]
    depends_on: [seaweedfs-master]
    networks: [internal]

networks:
  internal:
    internal: true
  edge:

volumes:
  postgres_data:
  redis_data:
  gotify_data:
  seaweedfs_mdata:
  seaweedfs_vdata:
