name: laju

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    stop_grace_period: 15s
    command: sh -c "npx prisma db push --accept-data-loss --skip-generate || true; exec node dist/main.js"
    env_file:
      - .env
    environment:
      PORT: "3000"
      SEAWEEDFS_FILER_URL: ${SEAWEEDFS_FILER_URL:-http://seaweedfs-filer:8888}
    volumes:
      - admin_media_data:/app/uploads
      - admin_media_data:/app/apps/api/uploads
    expose:
      - "3000"
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        delay: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.api.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.api.loadbalancer.healthcheck.interval=3s"
      - "traefik.http.services.api.loadbalancer.healthcheck.timeout=2s"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal, edge]

  worker:
    container_name: laju-worker
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["node", "dist/worker/main.js"]
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep 'worker/main.js' | grep -v grep || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [internal]

  backoffice:
    container_name: laju-backoffice
    build:
      context: .
      dockerfile: apps/backoffice/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.laju.chat}
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    ports:
      - "3001:3000"
    depends_on:
      api:
        condition: service_healthy
    networks: [internal, edge]

  portal:
    container_name: laju-portal
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.laju.chat}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://laju.chat}
    restart: unless-stopped
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3002"
    env_file:
      - .env
    expose:
      - "3002"
    ports:
      - "3002:3002"
    depends_on:
      api:
        condition: service_healthy
    networks: [internal, edge]

  postgres:
    container_name: laju-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    container_name: laju-redis
    image: redis:8-alpine
    restart: unless-stopped
    command: >
      sh -c "
        if [ -n \"$$REDIS_PASSWORD\" ]; then
          exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes
        else
          exec redis-server --appendonly yes
        fi
      "
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: >
        sh -c "
          if [ -n \"$$REDIS_PASSWORD\" ]; then
            redis-cli -a \"$$REDIS_PASSWORD\" ping
          else
            redis-cli ping
          fi
        "
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [internal]

  gotify:
    container_name: laju-gotify
    image: gotify/server:latest
    restart: unless-stopped
    environment:
      GOTIFY_DEFAULTUSER_NAME: ${GOTIFY_DEFAULTUSER_NAME:-lajuadmin}
      GOTIFY_DEFAULTUSER_PASS: ${GOTIFY_DEFAULTUSER_PASS:-laju_gotify_secure_pass_123}
    volumes:
      - gotify_data:/app/data
    networks: [internal]

  seaweedfs-master:
    container_name: laju-seaweedfs-master
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    entrypoint: ["sh", "-c", "mkdir -p /data/mdata && chmod -R 777 /data && exec weed master -port=9333 -ip=seaweedfs-master -mdir=/data/mdata"]
    environment:
      PORT: ""
    volumes:
      - seaweedfs_mdata:/data/mdata
    networks: [internal]

  seaweedfs-volume:
    container_name: laju-seaweedfs-volume
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    entrypoint: ["sh", "-c", "mkdir -p /data/vdata && chmod -R 777 /data && exec weed volume -port=8080 -ip=seaweedfs-volume -mserver=seaweedfs-master:9333 -dir=/data/vdata"]
    environment:
      PORT: ""
    volumes:
      - seaweedfs_vdata:/data/vdata
    depends_on: [seaweedfs-master]
    networks: [internal]

  seaweedfs-filer:
    container_name: laju-seaweedfs-filer
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    entrypoint: ["sh", "-c", "mkdir -p /data/fdata && chmod -R 777 /data && exec weed filer -port=8888 -ip=seaweedfs-filer -master=seaweedfs-master:9333 -defaultStoreDir=/data/fdata"]
    environment:
      PORT: ""
    volumes:
      - seaweedfs_fdata:/data
    depends_on: [seaweedfs-master]
    networks: [internal]

networks:
  internal:
    internal: true
  edge:

volumes:
  postgres_data:
  redis_data:
  gotify_data:
  seaweedfs_mdata:
  seaweedfs_vdata:
  seaweedfs_fdata:
  admin_media_data:
